name: snipe
on:
  workflow_dispatch:
  schedule:
    - cron: '30 14 12 9 *'
    - cron: '50 14 12 9 *'
    - cron: '20 16 12 9 *'
concurrency:
  group: snipe-window
  cancel-in-progress: false
jobs:
  snipe:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Too late guard (skip if window passed)
        id: guard
        run: |
          BJ=$(TZ=Asia/Shanghai date +%H%M)
          echo "beijing=$BJ"
          if [ "$BJ" -ge 2355 ]; then echo "toolate=true" >> $GITHUB_OUTPUT; else echo "toolate=false" >> $GITHUB_OUTPUT; fi
      - run: pip install miapply
        if: steps.guard.outputs.toolate == 'false'
      - name: Patch miapply with NTP fallback
        if: steps.guard.outputs.toolate == 'false'
        run: |
          SITE=$(python3 -c 'import miapply,os;print(os.path.dirname(miapply.__file__))')
          cp miapply_patched.py "$SITE/cli.py"
      - name: Write session
        if: steps.guard.outputs.toolate == 'false'
        env:
          SESSION_JSON: ${{ secrets.SESSION_JSON }}
        run: |
          mkdir -p ~/.migatesession/18n_bbs_global
          printf '%s' "$SESSION_JSON" > ~/.migatesession/18n_bbs_global/session.json
          python3 -c 'import json;json.load(open("/home/runner/.migatesession/18n_bbs_global/session.json"));print("session OK")'
      - name: Fire at 00:00 GMT+8 (delay 1000ms)
        if: steps.guard.outputs.toolate == 'false'
        run: printf '\n1000\n' | python3 -u $(command -v miapply)

  report:
    if: github.event_name == 'schedule' && github.event.schedule == '20 16 12 9 *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install miapply
      - name: Write session
        env:
          SESSION_JSON: ${{ secrets.SESSION_JSON }}
        run: |
          mkdir -p ~/.migatesession/18n_bbs_global
          printf '%s' "$SESSION_JSON" > ~/.migatesession/18n_bbs_global/session.json
      - name: Check state and write result.txt
        id: st
        run: |
          SITE=$(python3 -c 'import micommunity,os;print(os.path.dirname(os.path.dirname(micommunity.__file__)))')
          PYTHONPATH=$SITE python3 - <<'PY' > result.txt
          import json, requests, datetime
          from micommunity import STATE_URL, get_headers, state
          h = get_headers(silent=True)
          r = requests.Session().get(STATE_URL, headers=h, timeout=15)
          res = state(r)
          print("checked_at_utc:", datetime.datetime.now(datetime.timezone.utc).isoformat())
          print("code:", res.get("code"))
          print("message:", res.get("message"))
          PY
          cat result.txt
          if grep -q "code: 1" result.txt; then echo "won=true" >> $GITHUB_OUTPUT; else echo "won=false" >> $GITHUB_OUTPUT; fi
      - name: Commit result.txt
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request, urllib.error
          TOKEN = os.environ['GH_PAT']
          def api(path, data=None, method="GET"):
              req = urllib.request.Request(f"https://api.github.com{path}",
                  data=json.dumps(data).encode() if data is not None else None, method=method,
                  headers={"Authorization": f"Bearer {TOKEN}", "User-Agent": "zcode", "Accept": "application/vnd.github+json"})
              try:
                  with urllib.request.urlopen(req) as r:
                      b = r.read(); return json.loads(b) if b else {}
              except urllib.error.HTTPError as e:
                  if e.code == 404: return None
                  raise
          body = {"message": "result update", "content": base64.b64encode(open("result.txt","rb").read()).decode()}
          ex = api("/repos/work99767/bl-snipe/contents/result.txt")
          if ex: body["sha"] = ex["sha"]
          api("/repos/work99767/bl-snipe/contents/result.txt", body, "PUT")
          print("result.txt committed")
          PY
      - name: Reschedule next night if not won
        if: steps.st.outputs.won == 'false'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re, urllib.request, urllib.error, datetime
          TOKEN = os.environ['GH_PAT']
          def api(path, data=None, method="GET"):
              req = urllib.request.Request(f"https://api.github.com{path}",
                  data=json.dumps(data).encode() if data is not None else None, method=method,
                  headers={"Authorization": f"Bearer {TOKEN}", "User-Agent": "zcode", "Accept": "application/vnd.github+json"})
              try:
                  with urllib.request.urlopen(req) as r:
                      b = r.read(); return json.loads(b) if b else {}
              except urllib.error.HTTPError as e:
                  if e.code == 404: return None
                  raise
          path = "/repos/work99767/bl-snipe/contents/.github/workflows/snipe.yml"
          cur = api(path)
          yml = base64.b64decode(cur["content"]).decode()
          res = open("result.txt").read()
          nxt = datetime.date.today() + datetime.timedelta(days=1)
          if "Account Error" in res:
              nxt = nxt + datetime.timedelta(days=1)
          def sub(m):
              return m.group(1) + f" {nxt.day} {nxt.month} *'"
          yml2 = re.sub(r"(cron: '(?:30 14|50 14|20 16)) \d+ \d+ \*'", sub, yml)
          yml2 = re.sub(r"schedule == '20 16 \d+ \d+ \*'", f"schedule == '20 16 {nxt.day} {nxt.month} *'", yml2)
          if yml2 != yml:
              api(path, {"message": f"reschedule to {nxt.isoformat()}", "content": base64.b64encode(yml2.encode()).decode(), "sha": cur["sha"]}, "PUT")
              print("rescheduled to", nxt.isoformat())
          else:
              print("no changes needed")
          PY
